version: "3.8"

services:

  postgres:
    image: postgres:13
    container_name: airflow-postgres
    restart: always

    environment:
      POSTGRES_USER: your_airflow_db_user
      POSTGRES_PASSWORD: your_airflow_db_password
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "your_airflow_db_user"]
      interval: 10s
      retries: 5
      start_period: 5s

    networks:
      - airflow-network


  postgres_general:
    image: postgres:15
    container_name: general-postgres
    restart: always

    environment:
      POSTGRES_USER: your_general_db_user
      POSTGRES_PASSWORD: your_general_db_password
      POSTGRES_DB: your_database_name

    ports:
      - "5432:5432"

    volumes:
      - postgres_general_data:/var/lib/postgresql/data

    networks:
      - airflow-network


  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pgadmin
    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: your_email@example.com
      PGADMIN_DEFAULT_PASSWORD: your_pgadmin_password

    ports:
      - "8085:80"

    depends_on:
      - postgres_general

    networks:
      - airflow-network


  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    restart: always

    ports:
      - "1025:1025"
      - "8025:8025"

    networks:
      - airflow-network


  airflow-webserver:
    image: apache/airflow:2.7.1-python3.9
    container_name: airflow-webserver
    restart: always

    ports:
      - "8089:8080"

    environment:

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://your_airflow_db_user:your_airflow_db_password@postgres/airflow

      AIRFLOW__CORE__FERNET_KEY: your_fernet_key_here

      AIRFLOW__WEBSERVER__SECRET_KEY: your_secret_key_here

      AIRFLOW__WEBSERVER__BASE_URL: http://localhost:8089

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC

      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs

      TZ: UTC

      AIRFLOW__SMTP__SMTP_HOST: mailhog

      AIRFLOW__SMTP__SMTP_STARTTLS: "False"

      AIRFLOW__SMTP__SMTP_SSL: "False"

      AIRFLOW__SMTP__SMTP_PORT: "1025"

      AIRFLOW__SMTP__SMTP_MAIL_FROM: airflow@localhost


    volumes:
      - ./dags:/opt/airflow/dags
      - ./requirements.txt:/opt/airflow/requirements.txt
      - ./shared:/data
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins


    user: "50000:0"


    command:
      - bash
      - -c
      - |
        if [ -f /opt/airflow/requirements.txt ]; then
          pip install --user -r /opt/airflow/requirements.txt
        fi

        airflow db migrate

        airflow users create \
          --username your_airflow_username \
          --firstname Your \
          --lastname Name \
          --role Admin \
          --email your_email@example.com \
          --password your_airflow_password || true

        exec airflow webserver


    depends_on:
      postgres:
        condition: service_healthy


    networks:
      - airflow-network


  airflow-scheduler:
    image: apache/airflow:2.7.1-python3.9
    container_name: airflow-scheduler
    restart: always

    environment:

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://your_airflow_db_user:your_airflow_db_password@postgres/airflow

      AIRFLOW__CORE__FERNET_KEY: your_fernet_key_here

      AIRFLOW__WEBSERVER__SECRET_KEY: your_secret_key_here

      AIRFLOW__WEBSERVER__BASE_URL: http://localhost:8089

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC

      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs

      TZ: Africa/Cairo

      AIRFLOW__SMTP__SMTP_HOST: mailhog

      AIRFLOW__SMTP__SMTP_STARTTLS: "False"

      AIRFLOW__SMTP__SMTP_SSL: "False"

      AIRFLOW__SMTP__SMTP_PORT: "1025"

      AIRFLOW__SMTP__SMTP_MAIL_FROM: airflow@localhost


    volumes:
      - ./dags:/opt/airflow/dags
      - ./requirements.txt:/opt/airflow/requirements.txt
      - ./shared:/data
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins


    user: "50000:0"


    command:
      - bash
      - -c
      - |
        if [ -f /opt/airflow/requirements.txt ]; then
          pip install --user -r /opt/airflow/requirements.txt
        fi

        exec airflow scheduler


    depends_on:
      postgres:
        condition: service_healthy


    networks:
      - airflow-network


networks:
  airflow-network:
    driver: bridge


volumes:
  postgres-db-volume:

  postgres_general_data: